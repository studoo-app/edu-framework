version: '3'

silent: true

##
## ===   Variables ==================================================
##

vars:
  #
  # TASKFILE
  CONTRIBUTOR: "Benoit Foujols"
  ENV: main
  #
  # SYSTEM
  PWD: $PWD
  #
  # DOCKER
  DOCKER: docker
  DOCKER_FILE: docker-compose.yml
  DOCKER_RUN: "{{.DOCKER}} run"
  DOCKER_STOP: "{{.DOCKER}} stop"
  DOCKER_COMPOSE: "{{.DOCKER}} compose"
  #
  # COMPOSER
  COMPOSER: composer
  #
  # PHP UNIT TOOLS
  PHPUNIT: "php vendor/bin/phpunit"
  #
  # PHP QA TOOLS
  PHPQA: jakzal/phpqa:php8.4-alpine
  PHPQA_RUN: "{{.DOCKER_RUN}} --init -it --rm -v {{.PWD}}:/project -w /project {{.PHPQA}}"
  MYSQL_TESTING_RUN: "{{.DOCKER_RUN}} --init -it --rm -e MYSQL_ROOT_PASSWORD=studoo -e MYSQL_DATABASE=app_db -p 3309:3306 -d mysql:8.0 --name mysql-testing"
  #
  # DOCUMENTATION (properdocs)
  DOCS_VENV: venv
  DOCS_ADDR: 127.0.0.1:8000
  DOCS_URL: "http://{{.DOCS_ADDR}}/edu-framework/"

##
## ===   TASKS ==================================================
##

tasks:
  default:
    cmds:
      - task: help

  ## === 🆘  HELP ==================================================

  help:
    desc: "Description des tâches disponibles"
    cmds:
      - echo " ";
      - echo " 📦 YOUR SYSTEM ---------------------------------------------------------"
      - echo "Version {{.VERSION}}"
      - echo 'Your system "{{OS}}" / "{{ARCH}}"'
      - echo " ";
      - echo " 📦 ESSENTIAL TASK ---------------------------------------------------------"
      - echo "* start               Start project exemple"
      - echo "* stop                Stop project exemple"
      - echo "* docker-status       Check if Docker is up and show services with ports"
      - echo "* start-docs          Start the documentation ({{.DOCS_URL}})"
      - echo "* before-commit       Analyse project before commit"
      - echo " ";
      - echo " 🎛️ OTHER TASK ----------------------------------------------------------"
      - task --list

  ## === 🐋  DOCKER ================================================

  docker-up:
    desc: "Start docker containers"
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d"

  docker-stop:
    desc: "Stop docker containers"
    cmds:
      - "{{.DOCKER_COMPOSE}} stop"

  docker-down:
    desc: "Stop and remove docker containers, networks.."
    cmds:
      - "{{.DOCKER_COMPOSE}} down"

  docker-reset:
    desc: "Stop and reset on your environment"
    cmds:
      - "{{.DOCKER_COMPOSE}} down -v"

  docker-status:
    desc: "Vérifie que Docker est UP et affiche les services et leurs ports"
    cmds:
      - |
        # Docker est-il installé et démarré ?
        if ! command -v {{.DOCKER}} >/dev/null 2>&1; then
          echo " ❌ Docker n'est pas installé (commande « {{.DOCKER}} » introuvable)"
          exit 1
        fi
        if ! {{.DOCKER}} info >/dev/null 2>&1; then
          echo " ❌ Docker ne répond pas (daemon arrêté ?)"
          echo "    → Démarre Docker Desktop ou « colima start », puis relance « task docker-status »"
          exit 1
        fi
        echo " ✅ Docker est UP"

        # Services du projet (compose.yaml) en cours d'exécution
        RUNNING=$({{.DOCKER_COMPOSE}} ps --services)
        if [ -z "$RUNNING" ]; then
          echo " ⚠️  Aucun service du projet n'est démarré"
          echo "    → « task docker-up » pour les lancer"
          exit 0
        fi

        echo ""
        echo " 🐋 Services en cours :"
        {{.DOCKER_COMPOSE}} ps

        # Services définis mais arrêtés
        STOPPED=""
        for s in $({{.DOCKER_COMPOSE}} config --services); do
          echo "$RUNNING" | grep -qx "$s" || STOPPED="$STOPPED $s"
        done
        if [ -n "$STOPPED" ]; then
          echo ""
          echo " 💤 Services non démarrés :$STOPPED"
        fi

        # Urls d'accès (ports publiés sur l'hôte, cf. .env)
        port() { v="$(grep -E "^$1=" .env 2>/dev/null | head -n1 | cut -d= -f2-)"; v="${v:-$2}"; echo "${v#:}"; }
        up() { echo "$RUNNING" | grep -qx "$1"; }

        echo ""
        echo " 🔗 Accès aux services :"
        if up frankenphp; then
          echo "    🌐 Application : http://localhost:$(port HTTP_PORT 80) | https://localhost:$(port HTTPS_PORT 443)"
        fi
        if up database; then
          echo "    🗄️  MariaDB     : localhost:$(port DB_SOCKET 3306)"
        fi
        if up mailer; then
          echo "    📧 Mailpit     : http://localhost:$(port MAILER_UI_PORT 8025) (SMTP : localhost:$(port MAILER_SMTP_PORT 1025))"
        fi
        if up dbgate; then
          echo "    🧭 DbGate      : http://localhost:$(port DBGATE_PORT 8082)"
        fi
        if up phpmyadmin; then
          echo "    🐘 phpMyAdmin  : http://localhost:$(port PMA_PORT 8081)"
        fi

  ## === 📦  COMPOSER ==============================================

  composer-install:
    desc: "Install composer dependencies"
    cmds:
      - "{{.COMPOSER}} install"

  composer-update:
    desc: "Update composer dependencies"
    cmds:
      -  "{{.COMPOSER}} update"

  composer-validate:
    desc: Validate composer.json file.
    cmds:
      - "{{.COMPOSER}} validate"

  composer-validate-deep:
    desc: Validate composer.json and composer.lock files in strict mode.
    cmds:
      - "{{.COMPOSER}} validate --strict --check-lock"

  ## === 🐛  PHPQA =================================================

  qa-start-mysql:
    desc: "Start container Mysql Testing"
    cmds:
      - "{{.MYSQL_TESTING_RUN}}"

  qa-sleep:
    desc: "Repos avant le test"
    cmds:
      - "sleep 5"

  qa-stop-mysql:
    desc: "Stop container Mysql Testing"
    cmds:
      - "{{.DOCKER_STOP}} mysql-testing"

  qa-cs-fixer-dry-run:
    desc: "Run php-cs-fixer dry run"
    cmds:
      - "{{.PHPQA_RUN}} php-cs-fixer fix ./src --verbose --dry-run"

  qa-cs-fixer:
    desc: "Run php-cs-fixer"
    cmds:
      - "{{.PHPQA_RUN}} php-cs-fixer fix ./src --verbose"

  qa-phpstan:
    desc: "Run phpstan"
    cmds:
      - "{{.PHPQA_RUN}} phpstan analyse ./src --level=6"

  qa-phpcpd:
    desc: "Run phpcpd (copy/paste detector)"
    cmds:
      - "{{.PHPQA_RUN}} phpcpd ./src"

  qa-php-metrics:
    desc: "Run php-metrics"
    cmds:
      - "{{.PHPQA_RUN}} phpmetrics --report-html=var/phpmetrics ./src"

  ## === 🔎  TESTS =================================================

  build-env-testing:
    cmds:
      - |
        cd tests/Config/
        docker compose up -d
        sleep 10
        docker exec -i edu-testing-database sh -c 'exec mysql -uroot -p"studoo" app_db' < EtudiantMysql.sql

  destroy-env-testing:
    cmds:
      - |
        docker stop edu-testing-database
        docker remove edu-testing-database

  tests:
    deps: [build-env-testing]
    desc: "Run tests"
    cmds:
      - "{{.PHPUNIT}} --testdox"

  tests-debug:
    desc: "Run tests"
    cmds:
      - "{{.PHPUNIT}} --testdox --debug"

  tests-coverage:
    desc: "Run tests with coverage"
    cmds:
      - "{{.PHPUNIT}} --testdox tests --coverage-clover clover.xml"

  ## === ⭐  OTHERS =================================================

  before-commit:
    desc: "Run before commit"
    cmds:
      - task: qa-cs-fixer
      - task: qa-phpstan
      - task: qa-phpcpd
      - task: tests
      - task: tests-coverage
      - task: destroy-env-testing

  testunit:
    desc: "Run tests"
    cmds:
      - task: docker-up
      - task: tests
      - task: docker-down

  testunit-debug:
    desc: "Run tests"
    cmds:
      - task: docker-up
      - task: tests-debug
      - task: docker-down

  ex-start:
    desc: "Start project exemple"
    cmds:
      - |
        composer edu:start

  start:
    desc: "Start"
    cmds:
      - task: docker-up
      - task: ex-start

  stop:
    desc: "Stop"
    cmds:
      - |
        echo "Are you docker stop or down ? [S/d] :"
        read CONFIRM_DOCKER
        if [ "$CONFIRM_DOCKER" = "d" ]; then
          task docker-down
        else
          task docker-stop
        fi

  start-docs:
    desc: "Start the documentation (properdocs serve)"
    aliases: [start-doc]
    cmds:
      - |
        # Environnement Python de la documentation (créé au premier lancement)
        if [ ! -x {{.DOCS_VENV}}/bin/properdocs ]; then
          echo " 📦 Installation de l'environnement de la documentation ({{.DOCS_VENV}})"
          python3 -m venv {{.DOCS_VENV}}
          {{.DOCS_VENV}}/bin/pip install -q -r requirements.txt
        fi
        echo " 📖 Documentation : {{.DOCS_URL}}"
        {{.DOCS_VENV}}/bin/properdocs serve -a {{.DOCS_ADDR}}
